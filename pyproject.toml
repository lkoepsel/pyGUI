[project]
name = "pygui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "guizero>=1.6.0",
]

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install guisetup.py into the environment as a top-level module so
# `import guisetup` works from any lesson folder, not just the project root.
[tool.hatch.build.targets.wheel]
force-include = { "guisetup.py" = "guisetup.py" }
